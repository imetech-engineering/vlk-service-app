# Publiceert de app naar GitHub Pages bij elke push naar main.
# Bouwen en publiceren in twee jobs (aanbevolen opzet van actions/deploy-pages): het artefact is
# dan zeker geregistreerd voordat deploy het zoekt. In één job gaf deploy op 25-11-2026 drie keer
# 'No artifacts named "github-pages" were found'.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Alleen de app publiceren (geen tools of repo-bestanden)
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js icons _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
